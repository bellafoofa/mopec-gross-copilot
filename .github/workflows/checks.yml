name: Mopec code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check docs/v8.js
          node --check docs/v9.js
          node --check docs/workstation-core.js
          node --check docs/workstation-analysis.js
          node --check docs/workstation-workflow.js
          node --check docs/workstation-chat.js
          node --check docs/workstation-boot.js
          node --check src/worker.js
      - name: Backend regression tests
        run: npm test
