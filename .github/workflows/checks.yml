name: Mopec code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check src/worker.js
          node --check docs/workstation-core.js
          node --check docs/workstation-analysis.js
          node --check docs/workstation-workflow.js
          node --check docs/workstation-chat.js
          node --check docs/workstation-study.js
          node --check docs/workstation-sponsor.js
          node --check docs/workstation-imaging-v11.js
          node --check docs/workstation-segmentation-v11.js
          node --check docs/workstation-ops-v11.js
          node --check docs/workstation-boot.js
      - name: Workstation wiring and backend regression tests
        run: npm test
